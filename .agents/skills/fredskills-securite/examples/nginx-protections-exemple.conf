# EXEMPLE de fragments de configuration ; adapter/tester dans une vraie directive server {}
# Empêche exposition de fichiers techniques ; vérifier compatibilité avec les routes existantes.
location ~ /\.(?!well-known(?:/|$)) { deny all; }
location ~* \.(?:bak|sql|env|ini|log|old)$ { deny all; }
autoindex off;
